<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Lotto Insights – track, analyse and explore lottery history. Statistics only; no predictions." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Lotto Insights – Track, Analyse & Explore</title>
    <script>
      try {
        var t = localStorage.getItem('lotto-theme') || 'system';
        var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
